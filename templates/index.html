<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Canada Policy Rates Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --notion-bg: #191919;
            --notion-card: #202020;
            --notion-border: rgba(255, 255, 255, 0.08);
            --notion-text: #ffffff;
            --notion-text-muted: #9b9a97;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--notion-bg);
            color: var(--notion-text);
            margin: 0;
            padding: 30px 20px;
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto 20px auto;
            border-bottom: 1px solid var(--notion-border);
            padding-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .release-badges {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--notion-text-muted);
        }

        .release-badges span b {
            color: #f3f3f3;
        }

        .dashboard-grid {
            max-width: 1280px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--notion-card);
            border: 1px solid var(--notion-border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 4px 0;
            color: #f3f3f3;
        }

        .card-desc {
            color: var(--notion-text-muted);
            font-size: 12px;
            margin: 0 0 16px 0;
        }

        .chart-container {
            position: relative;
            height: 560px; /* Enlarged chart height */
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Bank of Canada Policy Rates & Forecast</h1>
        <div class="release-badges">
            <span>Last Release Date: <b id="lastRelease">Loading...</b></span>
            <span>Upcoming Release Date: <b id="upcomingRelease">Loading...</b></span>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h3 class="card-title">Policy & Bank Rate Comparison (%)</h3>
            <p class="card-desc" id="cardDesc">Loading current rate details...</p>
            <div class="chart-container">
                <canvas id="ratesChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function loadInterestRates() {
            try {
                const response = await fetch('/api/interest-rates');
                const result = await response.json();

                if (!result.success) {
                    document.getElementById('cardDesc').innerText = `Error: ${result.error}`;
                    return;
                }

                const meta = result.metadata;
                document.getElementById('cardDesc').innerText = 
                    `Latest Overnight Rate: ${meta.latest_overnight_rate}% | Bank Rate: ${meta.latest_bank_rate}%`;
                
                document.getElementById('lastRelease').innerText = meta.latest_date;
                document.getElementById('upcomingRelease').innerText = meta.upcoming_release;

                const historicalData = result.data.filter(row => row.overnight_rate !== null || row.bank_rate !== null);
                const forecastData = result.forecast || [];
                const allRows = [...historicalData, ...forecastData];
                
                const labels = allRows.map(row => row.date);
                const overnightValues = allRows.map(row => row.overnight_rate);
                const bankRateValues = allRows.map(row => row.bank_rate);
                const histLength = historicalData.length;

                // Plugin to render value text on top of final series data points
                const valueLabelPlugin = {
                    id: 'valueLabelPlugin',
                    afterDatasetsDraw(chart) {
                        const { ctx } = chart;
                        ctx.save();
                        ctx.font = 'bold 11px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';

                        const meta = chart.getDatasetMeta(1);
                        if (meta && meta.data && meta.data.length > 0) {
                            const lastPoint = meta.data[meta.data.length - 1];
                            const lastVal = overnightValues[overnightValues.length - 1];
                            if (lastPoint && lastVal !== null) {
                                ctx.fillStyle = '#2ecc71';
                                ctx.fillText(lastVal.toFixed(2) + '%', lastPoint.x, lastPoint.y - 8);
                            }
                        }
                        ctx.restore();
                    }
                };

                const ctx = document.getElementById('ratesChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Bank Rate (V39078)',
                                data: bankRateValues,
                                borderColor: '#3498db',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.1
                            },
                            {
                                label: 'Target for the Overnight Rate (V39079)',
                                data: overnightValues,
                                borderColor: '#2ecc71',
                                backgroundColor: 'rgba(46, 204, 113, 0.05)',
                                borderWidth: 2.5,
                                fill: true,
                                pointRadius: 0,
                                pointHoverRadius: 6,
                                tension: 0.1
                            },
                            {
                                label: 'Overnight Rate Forecast',
                                data: overnightValues.map((val, idx) => idx >= histLength - 1 ? val : null),
                                borderColor: '#e67e22',
                                borderDash: [5, 5],
                                borderWidth: 2,
                                pointRadius: 3,
                                pointBackgroundColor: '#e67e22',
                                tension: 0.1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#ffffff', font: { size: 12 } }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(24, 24, 24, 0.95)',
                                titleFont: { size: 12 },
                                bodyFont: { size: 13, weight: '600' },
                                padding: 10,
                                borderColor: 'rgba(255, 255, 255, 0.15)',
                                borderWidth: 1
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: '#8b8a87', font: { size: 11 }, maxTicksLimit: 14 }
                            },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.03)' },
                                ticks: { color: '#8b8a87', font: { size: 11 } }
                            }
                        }
                    },
                    plugins: [valueLabelPlugin]
                });

            } catch (err) {
                console.error("Failed to load interest rate data:", err);
                document.getElementById('cardDesc').innerText = "Failed to connect to backend API.";
            }
        }

        loadInterestRates();
    </script>
</body>
</html>
